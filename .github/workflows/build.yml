name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v3
      with:
        version: 10.x
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'pnpm'
    - run: pnpm install --no-frozen-lockfile --ignore-scripts
    - run: pnpm lint
      continue-on-error: true
    - run: pnpm build
      continue-on-error: true
    - run: pnpm test
