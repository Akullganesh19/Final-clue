name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        # We don't cache pnpm here because pnpm-lock.yaml doesn't exist yet in the repo

    - name: Install dependencies
      run: pnpm install

    - name: Lint
      run: pnpm lint
      continue-on-error: true

    - name: Build
      run: pnpm build
      continue-on-error: true

    - name: Test
      run: npx tsx --test "src/**/*.test.ts"
