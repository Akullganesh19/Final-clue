name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v3
      with:
        version: 9
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: pnpm install
    - run: pnpm lint
      continue-on-error: true
    - run: pnpm build
      continue-on-error: true
    - run: pnpm test
      continue-on-error: true
